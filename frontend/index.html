<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>FormSurface</title>
  <link rel="stylesheet" href="/src/styles/tokens.css">
  <link rel="stylesheet" href="/src/styles/app.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-logo" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" d="M12 2.8 20 7.4v9.2L12 21.2 4 16.6V7.4z"/><path fill="currentColor" d="M12 12 20 7.4v9.2L12 21.2z" opacity=".55"/></symbol>
  <symbol id="i-brush" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M14.5 4.5 19.5 9.5 11 18 6 13zM6 13c-2 0-3 1.5-3 3.5 0 1.2-.5 2-1 2.5 3 .5 6.5-.5 7-3.5"/></symbol>
  <symbol id="i-eraser" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" d="m4 15 9.5-9.5 6 6L12 19H8zM9 10l6 6M8 19h12"/></symbol>
  <symbol id="i-mirror" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M12 3v18M9 7 4 12l5 5zM15 7l5 5-5 5z"/></symbol>
  <symbol id="i-undo" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M9 14 4 9l5-5M4 9h10a6 6 0 0 1 0 12h-3"/></symbol>
  <symbol id="i-redo" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="m15 14 5-5-5-5M20 9H10a6 6 0 0 0 0 12h3"/></symbol>
  <symbol id="i-frame" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/><circle cx="12" cy="12" r="2.5" fill="currentColor"/></symbol>
  <symbol id="i-open" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" d="M3 7V5.5A1.5 1.5 0 0 1 4.5 4H9l2 2h8.5A1.5 1.5 0 0 1 21 7.5V18.5a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 18.5z"/></symbol>
  <symbol id="i-export" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M12 3v12M7 8l5-5 5 5M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></symbol>
  <symbol id="i-shape" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="1.8"/><path fill="none" stroke="currentColor" stroke-width="1.4" d="M4 12c3 2.5 13 2.5 16 0M12 4c-2.5 3-2.5 13 0 16"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></symbol>
  <symbol id="i-up" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="m6 15 6-6 6 6"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="m6 9 6 6 6-6"/></symbol>
  <symbol id="i-eye" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3" fill="currentColor"/></symbol>
  <symbol id="i-eye-off" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12zM4 20 20 4"/></symbol>
  <symbol id="i-link" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M10 14a4 4 0 0 0 5.7 0l3.6-3.6a4 4 0 0 0-5.7-5.7L12.5 5.8M14 10a4 4 0 0 0-5.7 0l-3.6 3.6a4 4 0 0 0 5.7 5.7l1.1-1.1"/></symbol>
  <symbol id="i-save"viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" d="M5 4h11l4 4v12H4V5a1 1 0 0 1 1-1zM8 4v5h7V4M8 20v-6h8v6"/></symbol>
</svg>

<div class="app">
  <header class="topbar">
    <div class="brand"><svg><use href="#i-logo"/></svg>FormSurface</div>
    <button class="btn" id="open-mesh" title="Open a mesh (glTF, GLB, OBJ, FBX)"><svg><use href="#i-open"/></svg>Open mesh</button>
    <div class="menu">
      <button class="btn" id="sample-toggle" aria-haspopup="true" aria-expanded="false"><svg><use href="#i-shape"/></svg>Sample mesh</button>
      <div class="menu-list" id="sample-menu" hidden>
        <button data-sample="sphere">Sphere</button>
        <button data-sample="knot">Torus knot (many UV seams)</button>
        <button data-sample="torus">Torus</button>
        <button data-sample="capsule">Capsule</button>
      </div>
    </div>
    <div class="row" style="grid-template-columns:auto 96px;width:auto;gap:6px"><label for="tex-size">Texture</label>
      <select id="tex-size"><option value="1024">1024</option><option value="2048" selected>2048</option><option value="4096">4096</option></select>
    </div>
    <div class="spacer"></div>
    <button class="btn" id="agent-link" aria-pressed="false" title="Let MCP agents (Claude Code, Codex, Cursor) drive this editor through the local service"><svg><use href="#i-link"/></svg><span id="agent-label">Agent link off</span></button>
    <button class="btn" id="screenshot"title="Save a PNG of the viewport"><svg><use href="#i-frame"/></svg>Screenshot</button>
    <button class="btn" id="save-project" title="Save textures to the local FormSurface service"><svg><use href="#i-save"/></svg>Save</button>
    <button class="btn primary" id="export" title="Export texture maps as PNG"><svg><use href="#i-export"/></svg>Export maps</button>
    <span class="version" id="version"></span>
    <input type="file" id="mesh-file" accept=".glb,.gltf,.obj,.fbx" hidden>
  </header>

  <nav class="tools" aria-label="Tools">
    <button class="icon-btn" id="tool-paint" aria-pressed="true" title="Paint (B)"><svg><use href="#i-brush"/></svg></button>
    <button class="icon-btn" id="tool-erase" aria-pressed="false" title="Eraser (E)"><svg><use href="#i-eraser"/></svg></button>
    <hr>
    <button class="icon-btn" id="tool-mirror" aria-pressed="false" title="Mirror X symmetry (M)"><svg><use href="#i-mirror"/></svg></button>
    <hr>
    <button class="icon-btn" id="undo" title="Undo (Ctrl+Z)"><svg><use href="#i-undo"/></svg></button>
    <button class="icon-btn" id="redo" title="Redo (Ctrl+Shift+Z)"><svg><use href="#i-redo"/></svg></button>
    <button class="icon-btn" id="frame" title="Frame mesh (F)"><svg><use href="#i-frame"/></svg></button>
  </nav>

  <main class="viewport" id="viewport">
    <canvas id="canvas" tabindex="0"></canvas>
    <div class="notice" id="notice">Starting the GPU engine</div>
    <div class="overlay" id="overlay">LMB paint · Alt+LMB or RMB orbit · MMB pan · wheel zoom · [ ] size</div>
  </main>

  <aside class="panel" aria-label="Properties">
    <section class="section">
      <h2>Brush</h2>
      <div class="row"><label for="b-size">Size</label><input id="b-size" type="range" min="2" max="400" value="40"><output for="b-size">40</output></div>
      <div class="row"><label for="b-hardness">Hardness</label><input id="b-hardness" type="range" min="0" max="1" step="0.01" value="0.6"><output for="b-hardness">0.60</output></div>
      <div class="row"><label for="b-flow">Flow</label><input id="b-flow" type="range" min="0.01" max="1" step="0.01" value="0.6"><output for="b-flow">0.60</output></div>
      <div class="row"><label for="b-opacity">Stroke opacity</label><input id="b-opacity" type="range" min="0" max="1" step="0.01" value="1"><output for="b-opacity">1.00</output></div>
      <div class="row"><label for="b-spacing">Spacing</label><input id="b-spacing" type="range" min="0.02" max="1" step="0.01" value="0.12"><output for="b-spacing">0.12</output></div>
      <label class="check"><input type="checkbox" id="b-cull" checked>Backface culling</label>
      <label class="check"><input type="checkbox" id="b-psize" checked>Pen pressure controls size</label>
      <label class="check"><input type="checkbox" id="b-pflow">Pen pressure controls flow</label>
    </section>
    <section class="section">
      <h2>Material</h2>
      <div class="channel"><input type="checkbox" id="c-use-color" checked aria-label="Paint base color"><label for="c-color">Base color</label><input id="c-color" type="color" value="#b82e1f"><output></output></div>
      <div class="channel"><input type="checkbox" id="c-use-rough" checked aria-label="Paint roughness"><label for="c-rough">Roughness</label><input id="c-rough" type="range" min="0" max="1" step="0.01" value="0.45"><output for="c-rough">0.45</output></div>
      <div class="channel"><input type="checkbox" id="c-use-metal" checked aria-label="Paint metallic"><label for="c-metal">Metallic</label><input id="c-metal" type="range" min="0" max="1" step="0.01" value="0"><output for="c-metal">0.00</output></div>
      <div class="channel"><input type="checkbox" id="c-use-height" aria-label="Paint height"><label for="c-height">Height</label><input id="c-height" type="range" min="0" max="1" step="0.01" value="0.75"><output for="c-height">0.75</output></div>
    </section>
    <section class="section">
      <h2>Layers
        <span>
          <button class="icon-btn" id="layer-add" title="Add paint layer"><svg><use href="#i-plus"/></svg></button>
          <button class="icon-btn" id="layer-delete" title="Delete layer"><svg><use href="#i-trash"/></svg></button>
        </span>
      </h2>
      <div class="layers" id="layers"></div>
      <div class="layer-props">
        <div class="row"><label for="l-blend">Blend</label><select id="l-blend">
          <option value="normal">Normal</option><option value="multiply">Multiply</option><option value="screen">Screen</option><option value="overlay">Overlay</option>
          <option value="add">Linear dodge (add)</option><option value="subtract">Subtract</option><option value="darken">Darken</option><option value="lighten">Lighten</option>
        </select><output></output></div>
        <div class="row"><label for="l-opacity">Opacity</label><input id="l-opacity" type="range" min="0" max="1" step="0.01" value="1"><output for="l-opacity">1.00</output></div>
      </div>
    </section>
    <section class="section">
      <h2>Base material</h2>
      <div class="row"><label for="m-color">Color</label><input id="m-color" type="color" value="#8a8a8a"><output></output></div>
      <div class="row"><label for="m-rough">Roughness</label><input id="m-rough" type="range" min="0" max="1" step="0.01" value="0.6"><output for="m-rough">0.60</output></div>
      <div class="row"><label for="m-metal">Metallic</label><input id="m-metal" type="range" min="0" max="1" step="0.01" value="0"><output for="m-metal">0.00</output></div>
    </section>
    <section class="section">
      <h2>Display</h2>
      <div class="row"><label for="d-exposure">Exposure</label><input id="d-exposure" type="range" min="0.2" max="3" step="0.05" value="1"><output for="d-exposure">1.00</output></div>
      <div class="row"><label for="d-normal">Height bump</label><input id="d-normal" type="range" min="0" max="4" step="0.05" value="1"><output for="d-normal">1.00</output></div>
    </section>
  </aside>

  <footer class="status"><span class="msg" id="status">Ready</span><span id="mesh-info"></span><span id="gpu-info"></span><span id="fps"></span></footer>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
